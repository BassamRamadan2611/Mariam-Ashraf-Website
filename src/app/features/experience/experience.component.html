<section class="section" id="experience">
  <div class="container">
    <div class="section-header" appScrollReveal="fade-up">
      <span class="section-tag">{{ 'exp_tag' | translate }}</span>
      <h2>{{ 'exp_title' | translate }}</h2>
      <div class="section-line"></div>
    </div>

    <div class="timeline">
      <div
        class="timeline-item"
        *ngFor="let exp of experiences; let i = index"
        appScrollReveal="fade-left"
        [revealDelay]="i * 100">
        <div class="timeline-dot">
          <div class="dot-inner"></div>
        </div>
        <div class="timeline-connector" *ngIf="i < experiences.length - 1"></div>

        <div class="exp-card card">
          <div class="exp-header">
            <div class="exp-info">
              <h3 class="exp-role">{{ exp.role }}</h3>
              <p class="exp-company">
                <i class="fa-solid fa-building"></i> {{ exp.company }}
              </p>
            </div>
            <div class="exp-meta">
              <span class="exp-period">
                <i class="fa-regular fa-calendar"></i> {{ exp.period }}
              </span>
              <span class="exp-type" [class]="getTypeClass(exp.type)">{{ exp.type }}</span>
            </div>
          </div>
          <p class="exp-desc" *ngIf="exp.description">{{ exp.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
